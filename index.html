<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>두뇌건강 다마고치</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
<main>
  <section id="egg" hidden>
    <div class="pet-box lcd"><span id="egg-pet" class="pet"></span></div>
    <p class="big">함께 지낼 친구의 알이에요!</p>
    <label>친구 이름<input id="pet-name" maxlength="10" placeholder="예: 뭉치"></label>
    <label>어르신을 어떻게 불러 드릴까요?<input id="who-name" maxlength="12" placeholder="예: 순자 할머니"></label>
    <button id="hatch" class="wide">시작하기</button>
    <p class="hint">매일 건강 체크와 두뇌 운동을 하시면 친구가 밝게 자라요. 기록은 이 기기 안에만 저장돼요.</p>
  </section>

  <section id="home" hidden>
    <header>
      <span id="home-title"></span>
      <span id="home-stars"></span>
    </header>
    <div class="pet-box lcd">
      <img id="pet-img" alt="" hidden>
      <span id="pet-emoji" class="pet"></span>
    </div>
    <p id="pet-talk" class="speech"></p>
    <p id="risk" class="risk" hidden></p>
    <button id="check-start" class="wide"></button>
    <h2>🧠 두뇌 운동</h2>
    <div id="subjects" class="grid"></div>
    <div class="row">
      <button id="open-book">📖 도감</button>
      <button id="share">💌 보호자에게 보내기</button>
    </div>
    <div class="row">
      <button id="open-records" class="small">기록 보기</button>
      <button id="reset" class="small">처음부터</button>
      <button id="demo-next" class="small" hidden>시연: 하루 넘기기 ▶</button>
    </div>
  </section>

  <section id="check" hidden>
    <header>
      <button class="back small">← 홈</button>
      <span id="check-progress"></span>
      <span></span>
    </header>
    <div class="pet-box lcd">
      <img id="check-img" alt="" hidden>
      <span id="check-emoji" class="pet"></span>
    </div>
    <p id="check-q" class="speech big"></p>
    <div id="yesno" class="row">
      <button id="yes" class="answer huge">⭕ 네</button>
      <button id="no" class="answer huge alt">❌ 아니요</button>
    </div>
    <div id="moods" class="row" hidden>
      <button class="answer huge" data-mood="good">😊 좋음</button>
      <button class="answer huge alt" data-mood="ok">🙂 보통</button>
      <button class="answer huge alt" data-mood="bad">😟 나쁨</button>
    </div>
    <p id="check-reply" class="big"></p>
    <button id="listen" class="small">🎤 말로 대답하기</button>
  </section>

  <section id="units" hidden>
    <header>
      <button class="back small">← 홈</button>
      <span id="units-title"></span>
      <span></span>
    </header>
    <div id="unit-list" class="list"></div>
  </section>

  <section id="quiz" hidden>
    <header>
      <button class="back small">← 홈</button>
      <span id="quiz-progress"></span>
      <button id="replay" class="small">🔊 다시 듣기</button>
    </header>
    <p id="question" class="speech big"></p>
    <div id="choices" class="choices"></div>
    <p id="feedback" class="big"></p>
  </section>

  <section id="result" hidden>
    <div class="pet-box lcd"><span id="result-pet" class="pet"></span></div>
    <h1 id="result-title"></h1>
    <p id="result-text" class="big"></p>
    <div id="result-friend" class="card new" hidden></div>
    <button id="result-home" class="wide">홈으로</button>
  </section>

  <section id="book" hidden>
    <header>
      <button class="back small">← 홈</button>
      <span id="book-title"></span>
      <span></span>
    </header>
    <div id="book-grid" class="book"></div>
  </section>

  <section id="records" hidden>
    <header>
      <button class="back small">← 홈</button>
      <span>기록 보기</span>
      <span></span>
    </header>
    <h2>🩺 최근 7일 건강 체크</h2>
    <pre id="week"></pre>
    <p><a href="dashboard.html" target="_blank">🏥 의료진·복지사 화면 보기 (시연용)</a></p>
    <h2>🧠 두뇌 운동 기록</h2>
    <table>
      <thead><tr><th>과목</th><th>단원</th><th>도감</th><th>최고 점수</th><th>도전</th></tr></thead>
      <tbody id="record-rows"></tbody>
    </table>
    <p class="hint">최고 점수 = 처음 고른 답이 맞은 문제 수 (5문제 중)</p>
  </section>
</main>
<script src="content.js?v=11"></script>
<script src="logic.js?v=11"></script>
<script src="sprites.js?v=11"></script>
<script src="game.js?v=11"></script>
</body>
</html>
